name: Create/Delete Branch for Pull Request

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  setup:
    name: Setup
    outputs:
      branch: ${{ steps.preview.outputs.branch }}
      enabled: ${{ steps.preview.outputs.enabled }}
    runs-on: ubuntu-latest
    steps:
      - name: Check preview eligibility
        id: preview
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          TRUSTED_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
          HAS_API_KEY: ${{ secrets.NEON_API_KEY != '' }}
          PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: |
          echo "branch=$(printf '%s' "$HEAD_BRANCH" | tr -c 'A-Za-z0-9._-' '-')" >> "$GITHUB_OUTPUT"
          if [ "$TRUSTED_PR" = "true" ] && [ "$HAS_API_KEY" = "true" ] && [ "$PROJECT_ID" = "noisy-boat-95673317" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Neon previews skipped: requires a same-repository PR, an available API key, and the approved project." >> "$GITHUB_STEP_SUMMARY"
          fi

  create_neon_branch:
    name: Create Neon Branch
    needs: setup
    if: |
      needs.setup.outputs.enabled == 'true' && github.event_name == 'pull_request' && (
      github.event.action == 'synchronize'
      || github.event.action == 'opened'
      || github.event.action == 'reopened')
    runs-on: ubuntu-latest
    steps:
      - name: Get branch expiration date as an env variable (2 weeks from now)
        id: get_expiration_date
        run: echo "EXPIRES_AT=$(date -u --date '+14 days' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
      - name: Create Neon Branch
        id: create_neon_branch
        uses: neondatabase/create-branch-action@fb620d43d4c565abaf088b848a4e28e5c4ea4d9c # v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: preview/pr-${{ github.event.number }}-${{ needs.setup.outputs.branch }}
          api_key: ${{ secrets.NEON_API_KEY }}
          expires_at: ${{ env.EXPIRES_AT }}

  delete_neon_branch:
    name: Delete Neon Branch
    needs: setup
    if: needs.setup.outputs.enabled == 'true' && github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Delete Neon Branch
        uses: neondatabase/delete-branch-action@4468d825d5a88ef4012f1705a82f02ec3072f776 # v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: preview/pr-${{ github.event.number }}-${{ needs.setup.outputs.branch }}
          api_key: ${{ secrets.NEON_API_KEY }}
