name: Examination Hub CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  security-hygiene:
    name: Security Hygiene (Secrets & Clerk Scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify environment templates contain placeholders only
        run: |
          if grep -rnEi "(npg_|postgres://|postgresql://|sk_live_|sk_test_|AKIA|ghp_|clerk)" \
            .env.example backend/.env.example frontend/.env.example; then
            echo "ERROR: Credential or Clerk reference found in .env.example template!"
            exit 1
          fi
      - name: Scan active code and packages for stale Clerk references or leaked tokens
        run: |
          if grep -rnEi "(npg_|sk_live_|sk_test_|AKIA|ghp_|@clerk|VITE_CLERK|NEXT_PUBLIC_CLERK|CLERK_)" \
            package.json package-lock.json \
            backend/app backend/alembic backend/requirements.txt backend/requirements-dev.txt \
            frontend/package.json frontend/package-lock.json frontend/index.html frontend/vercel.json frontend/src; then
            echo "ERROR: Potential credential token or stale Clerk reference found in active source/config!"
            exit 1
          fi

  backend:
    name: Backend (Ruff, Alembic & Pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint with Ruff
        run: ruff check app tests alembic
      - name: Verify single linear Alembic head and history
        run: |
          HEAD_COUNT=$(alembic heads | awk 'NF{c++} END{print c+0}')
          alembic heads
          if [ "${HEAD_COUNT}" -ne 1 ]; then
            echo "ERROR: Expected exactly 1 Alembic head, found ${HEAD_COUNT}."
            exit 1
          fi
          alembic history
      - name: Offline Alembic SQL generation check
        run: |
          DATABASE_URL="postgresql+psycopg://offline@127.0.0.1:5432/offline" alembic upgrade head --sql > /dev/null
      - name: Run pytest
        run: pytest

  frontend:
    name: Frontend (Lint, Tests, Build & Bundle Scan)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate Vercel SPA configuration JSON
        run: node -e "JSON.parse(require('fs').readFileSync('vercel.json', 'utf8'))"
      - name: Install dependencies
        run: npm ci
      - name: Lint and typecheck
        run: npm run lint
      - name: Run frontend tests
        run: npm test --if-present
      - name: Production build
        run: npm run build
      - name: Scan build output for server secrets and Clerk references
        run: |
          if grep -rnEi "(sk_live_|sk_test_|npg_|GOOGLE_CLIENT_SECRET|NEON_API_KEY|NEON_AUTH_JWKS_URL|DIRECT_DATABASE_URL|DATABASE_URL|postgres://|postgresql://|clerk)" dist/; then
            echo "ERROR: Potential server secret or stale Clerk reference found in frontend build output!"
            exit 1
          fi

  docker-smoke:
    name: Backend Docker Smoke Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend Docker image
        run: docker build -f backend/Dockerfile -t examination-hub-api:ci backend/
      - name: Verify /health endpoint in container
        run: |
          docker run -d --name api-smoke -p 8000:8000 examination-hub-api:ci
          trap 'docker rm -f api-smoke >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8000/health | grep -q '"status":"healthy"'; then
              echo "Container /health verified."
              exit 0
            fi
            sleep 1
          done
          docker logs api-smoke
          exit 1
